[pytest]
# catalog/ is listed so a pack's own tests ship with the pack — adding an
# emulator must not mean editing a central test directory as well.
testpaths = backend/tests catalog

# Required by that layout: every pack names its file catalog/<id>/tests/
# test_generator.py, and the default "prepend" import mode derives a module
# name from the basename alone, so the second one collides with the first.
# importlib keys them by full path instead.
addopts = --import-mode=importlib

markers =
    network: hits an external service (GameTDB, xlenore) — deselect with -m "not network"
