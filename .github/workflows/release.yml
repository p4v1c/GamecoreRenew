name: Build and Release

on:
  push:
    branches:
      - main
    # Only release when something we actually ship changes — doc-only
    # pushes (README…) must not spam the box with fake updates.
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'electron/**'
      - 'update/**'
      - 'install/**'
      - 'config/**'
      - 'assets/**'
      - 'catalog/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The tagging step pushes a tag and publishes a release, so the token needs write.
    permissions:
      contents: write

    # Published so the `iso` job below can attach its image to THIS release
    # rather than computing a tag of its own. Two independent tag computations
    # is how an ISO ends up on the wrong release — or on a release that does not
    # exist yet.
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important pour que l'auto-tag puisse voir l'historique

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Runs BEFORE the tag step on purpose. Every push to main is published as
      # a release that the whole fleet auto-installs, so a red backend must stop
      # the line here — a failed step ends the job, which means no tag and no
      # publish. Network-marked tests are deselected: the runner should not be
      # able to fail the build because GameTDB is down.
      # Offline, and deliberately ahead of the test suite: a malformed pack
      # should fail with "unknown property 'romsPath'", not with a traceback
      # from whatever loaded it first.
      - name: Validate the catalogue
        run: |
          python scripts/check-catalog.py

      # Static analysis, ahead of the tests: an unused import or an unquoted
      # rm -rf is cheaper to read in isolation than inside a test failure.
      #
      # The rulesets are deliberately narrow — see pyproject.toml for why, and
      # for the per-file exceptions and the reason each one is legitimate.
      # Versions pinned like everything else the build depends on.
      - name: Lint — Python (ruff) and shell (shellcheck)
        run: |
          pip install 'ruff==0.16.1' 'shellcheck-py==0.11.0.1'
          ruff check .
          shellcheck -S warning $(git ls-files '*.sh') install/bin/*

      # The .dist files are build output now. A pack edited without
      # regenerating them is a box that disagrees with itself.
      - name: Catalogue is in sync with install/generated/*.dist
        run: |
          python scripts/gen-catalog.py --check

      # A personal username has no business in a public repository, and the
      # two independent sed passes that used to chase it are gone.
      - name: No harvest-box home path left
        run: |
          # Scoped to shipped CONTENT: the generated catalogues, the packs and
          # config/. The substitution that used to rewrite the literal at
          # install time is gone — @HOME@ is the only mechanism now.
          if grep -rn '/home/pavic' catalog/ install/generated/*.dist config/*.json 2>/dev/null; then
            echo "::error::a literal /home/pavic is back — use the @HOME@ token"
            exit 1
          fi

      - name: Test backend
        run: |
          pip install -r backend/requirements.txt pytest
          python -m compileall -q backend
          # catalog/*/tests/ is discovered too, so a pack's tests arrive with
          # the pack rather than in a central directory nobody updates.
          pytest backend/tests catalog -q -m "not network"

      # --- TAG AUTO-INCREMENT STEP ---
      # Pinned to the commit behind 1.64.0: this action runs with contents:write
      # and the repo GITHUB_TOKEN, so a movable tag would let an upstream force-push
      # execute arbitrary code against our releases.
      - name: Minor version for each merge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: tag_version
        uses: anothrNick/github-tag-action@c360518fb8131e99795f8208f8a6105ceca55ec2 # 1.64.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch # bumps the last digit (e.g. 1.0.1 -> 1.0.2)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        # `npm run test:run` sits BEFORE the build and is blocking, like every
        # other step in this file. There is no continue-on-error anywhere here
        # and that is deliberate: this workflow is what let an installer that
        # segfaulted reach a release, and a red step must mean no tag.
        run: |
          cd frontend
          npm ci
          npm run test:run
          npm run build

      - name: Package — OTA archive
        run: |
          mkdir -p dist_ota
          cp -r backend       dist_ota/
          # The whole frontend/, sources included — not just dist/. A box must
          # never be left with sources older than the build it runs: anything
          # that rebuilds there (update/linux.sh's fallback, a hand-run
          # `npm run build`) would otherwise regenerate dist/ from stale code and
          # silently roll the UI back to whatever shipped with the first install.
          # Layout matches the install dir, so the rsync lands each file in place.
          cp -r frontend      dist_ota/
          cp -r config        dist_ota/
          cp -r electron      dist_ota/
          cp -r update        dist_ota/
          cp -r install       dist_ota/
          # Shipped content, and it MUST be overwritten by an update: this is
          # what finally lets a corrected logo or seed reach an installed box.
          cp -r catalog       dist_ota/
          # The installers CALL these (catalog-query.py, gamecore-provider.py).
          # Leaving them out does not degrade anything — it breaks the install
          # outright, and only on a real box, never in CI.
          cp -r scripts       dist_ota/
          # The tag, not the tracked VERSION file: that one still says v1.0.0
          # (it is only ever written on a box by update/linux.sh), so shipping
          # it would make every fresh install report itself out of date.
          echo "${{ steps.tag_version.outputs.new_tag || github.ref_name }}" > dist_ota/VERSION
          find dist_ota -name 'node_modules' -exec rm -rf {} + 2>/dev/null || true
          find dist_ota -name '__pycache__'  -exec rm -rf {} + 2>/dev/null || true
          tar -czf gamecore-ota.tar.gz -C dist_ota .

      - name: Package — Full archive
        run: |
          mkdir -p dist_full
          cp -r backend     dist_full/
          cp -r frontend    dist_full/
          cp -r electron    dist_full/
          cp -r config      dist_full/
          cp -r assets      dist_full/
          cp -r update      dist_full/
          cp -r install     dist_full/
          cp -r catalog     dist_full/
          cp -r scripts     dist_full/
          # Same as the OTA archive: a full install with no VERSION falls back
          # to APP_VERSION="v1.0.0" and offers an update on first boot.
          echo "${{ steps.tag_version.outputs.new_tag || github.ref_name }}" > dist_full/VERSION
          find dist_full -name 'node_modules' -exec rm -rf {} + 2>/dev/null || true
          find dist_full -name '__pycache__'  -exec rm -rf {} + 2>/dev/null || true
          tar -czf gamecore-full.tar.gz -C dist_full .

      # Blocking, and it has to be. It was continue-on-error, on the grounds
      # that a convenience asset must not stop the core release — and what
      # that produced was a release whose installer binary segfaulted on the
      # first key typed into any field, published without anyone noticing the
      # build had anything to say. A broken installer is not a degraded
      # release; it is the front door.
      #
      # Versions are pinned. Unpinned, the Qt inside the binary changed at
      # every release, so the installer someone tested was never the one the
      # next release shipped — which is the exact shape of the libxkbcommon
      # bug the .spec exists to prevent. Bump these deliberately, and test the
      # binary on a rolling distro when you do.
      - name: Build installer binary (PyInstaller)
        id: build_installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1
          pip install 'pyside6==6.11.1' 'pyinstaller==6.21.0'
          cd install/installer-gui
          # The .spec, never the CLI form: onefile/windowed are the easy half of
          # it. The half that matters is the list of libraries kept OUT of the
          # bundle, which has no command-line equivalent — this runner is Ubuntu
          # and the boxes are Arch/Manjaro, and shipping the runner's
          # libxkbcommon next to the host's libxkbcommon-x11 segfaulted the
          # wizard on the first key typed. See the spec's header.
          pyinstaller --noconfirm --clean gamecore-installer.spec

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag || github.ref_name }}
          files: |
            gamecore-ota.tar.gz
            gamecore-full.tar.gz
            install/installer-gui/dist/gamecore-installer
          # true: the three assets are the release. A missing one used to be
          # silent, and `latest/download/gamecore-installer` then 404s for
          # everyone who follows the README.
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # ── The installation ISO ─────────────────────────────────────────
  #
  # A separate job, running AFTER the release exists and attaching to it.
  #
  # That ordering is a deliberate trade-off and not the pattern the rest of this
  # file uses. Every push to main is a release the whole fleet auto-installs,
  # and this job takes the better part of an hour and needs ~25 GB. Making the
  # OTA archive wait behind it would put a fix for a broken box forty-five
  # minutes further away, and a broken ISO build would stop that fix reaching
  # anyone at all.
  #
  # So the core release publishes first and the ISO catches up. There is still
  # no continue-on-error: a failed ISO build is a red cross on the commit and
  # `fail_on_unmatched_files` below makes a silently-missing image impossible.
  # What it cannot do is un-publish the release — the window where the latest
  # release has no ISO is real, and visible.
  #
  # Every clause above still holds, but it described an intention rather than an
  # observation until 2026-08: this job had never once reached its upload step,
  # so the "window" was not a gap between the release and its image, it was every
  # release ever published. Two stacked causes, both fixed — npm >= 11.6 blocking
  # Electron's postinstall, and Node 26 extracting nothing when it is unblocked.
  # See the Arch dependencies step and install/iso/build.sh.
  iso:
    needs: build
    # Only for an actual release: a push to main, or a v*.*.* tag. Both are
    # release paths the build job publishes for, and both deserve an image.
    #
    # What this excludes is `workflow_dispatch` from a branch. That is the trap
    # the Publish step's `tag_name` fallback carries — with no guard it resolves
    # to github.ref_name, and an ISO would be attached to a release named after
    # someone's working branch, which the fleet would then read as the latest.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # mkarchiso runs pacstrap and mounts loop devices, so it needs Arch and it
    # needs real privileges. --privileged is what makes the loop mounts work;
    # without it mkarchiso fails at the squashfs step with a mount error that
    # reads like a corrupt profile.
    #
    # /mnt is bind-mounted because the runner's root filesystem has ~14 GB free
    # and this build needs ~25 GB. /mnt is the large scratch disk every GitHub
    # runner has, and GAMECORE_ISO_SCRATCH below points build.sh at it.
    container:
      image: archlinux:latest
      options: --privileged -v /mnt:/mnt

    steps:
      # Before the checkout, on purpose: the archlinux image has no git, and
      # actions/checkout silently falls back to a REST tarball download without
      # it — which produces a tree with no .git, and build.sh reads VERSION and
      # the tag from the checkout.
      # nodejs-lts-jod (22.x), NOT the rolling `nodejs` (26.x at the time of
      # writing), and this is load-bearing rather than conservatism.
      #
      # Electron 31's postinstall extracts the binary it downloads with
      # extract-zip 2.0.1 / yauzl 2.10. On Node 26 that extraction stalls: the
      # promise never settles, node drains the event loop and exits 0 having
      # written ~350 KB of dist/locales and no `dist/electron`. No error, no
      # non-zero status — the only symptom is build.sh's guard firing forty
      # minutes later, which reads exactly like the npm policy problem below
      # and is a completely different bug.
      #
      # Measured on the same zip, same npm, same allowScripts: Node 26 → 352 KB
      # and no binary, Node 22 → 260 MB and a 182 MB dist/electron.
      #
      # The ISO itself still ships the rolling `nodejs` (packages.x86_64) and
      # that is fine: dist/electron is a standalone Chromium build, and the
      # frontend bundle this produces is byte-identical to the Node 26 one.
      - name: Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            archiso git nodejs-lts-jod npm python python-pip base-devel
          # Named in the log on purpose: when this job breaks again, the first
          # question is which node and which npm ran, and scrolling pacman
          # output for it is how the last diagnosis lost an afternoon.
          node --version
          npm --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}

      # The ISO reports the version of the release it is attached to, not the
      # day the runner happened to build it. profiledef.sh and build.sh both
      # read this variable, so the filename and the volume metadata agree.
      - name: Build the ISO
        env:
          GAMECORE_ISO_VERSION: ${{ needs.build.outputs.tag }}
          GAMECORE_ISO_SCRATCH: /mnt/gamecore-iso
        run: |
          mkdir -p /mnt/gamecore-iso
          df -h /mnt
          bash install/iso/build.sh --out "$PWD/out"
          ls -lh out/

      # GitHub refuses any release asset over 2 GiB. This image is a whole
      # desktop — Plasma, all three GPU driver stacks, linux-firmware — plus the
      # offline payload, so it is expected to be over that line, and "the upload
      # step failed" is not a useful thing to discover on a release day.
      #
      # Split rather than trimmed: every one of those packages is there because
      # an offline install on unknown hardware needs it (see packages.x86_64),
      # so shipping the image in parts costs one `cat` and shipping it smaller
      # costs a box that boots to a black screen.
      #
      # The .sha256 keeps covering the WHOLE image, which is what makes the
      # reassembly checkable: cat the parts, verify, burn.
      - name: Split the image if GitHub cannot take it whole
        working-directory: out
        run: |
          iso=$(ls -- *.iso)
          limit=$((2 * 1024 * 1024 * 1024))
          size=$(stat -c%s -- "$iso")
          echo "$iso is $((size / 1024 / 1024)) MiB (GitHub's asset limit is 2048 MiB)"
          if [ "$size" -le "$limit" ]; then
            echo "fits — uploading it whole."
            exit 0
          fi
          # 1900 MiB leaves headroom under the limit without producing a long
          # tail of parts.
          split -b 1900M -d --additional-suffix=.part -- "$iso" "${iso}."
          rm -f -- "$iso"
          cat > REASSEMBLE.txt <<EOF
          ${iso} is larger than the 2 GiB GitHub allows for a single release
          asset, so it is published in parts.

          Download every ${iso}.NN.part file and the .sha256, then:

              cat ${iso}.*.part > ${iso}
              sha256sum -c ${iso}.sha256

          The checksum covers the reassembled image. Only write it to a USB
          stick once that check says OK.
          EOF
          ls -lh

      - name: Attach the ISO to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          # The whole directory, because what is in it depends on the step
          # above — one .iso, or N .part files plus REASSEMBLE.txt. Naming
          # `out/*.iso` here would make every split build fail on an unmatched
          # glob, which is the opposite of what the split is for.
          files: out/*
          # build.sh always writes at least an image and its .sha256, so an
          # empty out/ means the build produced nothing and said it succeeded.
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
