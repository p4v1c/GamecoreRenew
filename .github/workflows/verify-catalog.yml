name: Verify the catalogue upstream

# Weekly, not on every push, and that split is the point.
#
# verify_emulators.py needs the network: it asks Flathub and the GitHub
# releases API whether everything the catalogue says to install still exists.
# Wired into the release job it would turn a slow Flathub into a red build and
# block a release that has nothing to do with it — so it runs on its own
# schedule.
#
# This is the job that would have caught the gopher64 migration: the N64 slot
# moved to Rosalie's Mupen GUI while verify_emulators.py went on checking
# io.github.gopher64.gopher64 — a real Flathub entry, so it stayed green while
# pointing at an application nobody installs. It reads catalog/<id>/pack.json
# now, so "what we verify" and "what we install" cannot come apart again.
#
# It no longer only reports. A run that finds something opens an issue, because
# a red tick in a tab nobody has open is the same as no check at all — and the
# whole value of this job is learning that an upstream is gone BEFORE a player
# does. `install.appIds` is what buys the time; this is what starts the clock.
#
# Two distinct findings, both worth the issue:
#
#   dead      a pack whose every candidate is gone. That system is unusable on
#             any box installed from now on.
#   degraded  a pack whose preferred candidate is gone and which is running on
#             a fallback. Nothing is broken yet, and that is exactly why it
#             would otherwise go unnoticed until the fallback goes too — at
#             which point the list is empty and there is no warning left to
#             give.

on:
  schedule:
    - cron: '17 4 * * 1'      # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write               # the whole point of the job — see the header

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install -q requests

      # `continue-on-error`, uniquely in this repository, and deliberately: a
      # finding must reach the issue step rather than end the job. Everything
      # in release.yml is blocking for the opposite reason — that one gates a
      # release, this one gates nothing and only reports.
      - name: Check every app id and release asset the catalogue declares
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          python verify_emulators.py 2>&1 | tee report.txt

      - name: Open an issue when something upstream has moved
        if: steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const report = fs.readFileSync('report.txt', 'utf8')
            // One open issue, reused. A weekly cron that files a fresh issue
            // every Monday buries the first one — the one somebody had
            // already started reading — under seven duplicates a month.
            const title = 'Catalogue: an upstream app id has moved or gone'
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'catalogue-upstream',
            })
            const body = [
              'The weekly upstream check found something. Full output:',
              '', '```', report.slice(-55000), '```', '',
              '**A `DEGRADED` line is not cosmetic.** It means a pack is running',
              'on a fallback and its preferred candidate is gone — nothing is',
              'broken yet, and there will be no second warning if the fallback',
              'goes too.',
              '',
              'The fix does not need a release: add the surviving app id to',
              '`install.appIds`, bump `catalog/CATALOG_VERSION`, and sign a',
              'bundle — see `catalog/_ota/README.md`.',
              '', `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n')

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['catalogue-upstream'],
              })
            }

      # The job itself stays green: the issue IS the report, and a permanently
      # red weekly cron is a badge people learn to ignore. A failure here would
      # also be indistinguishable from Flathub having been slow.
      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.verify.outcome }}" = "failure" ]; then
            echo "::warning::the catalogue check found something — see the open issue"
          fi
