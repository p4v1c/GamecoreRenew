<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>GameCore</title>
<!--
  The first thing on the television, and the only thing that has to work when
  nothing else does.

  It is loaded from disk with `file://` — no backend, no network, no API, no
  bundle. That is the whole point: the window used to be created only AFTER the
  wait for the backend, so what covered the screen during that wait was the
  desktop. Wallpaper, panel, and whatever the player had left open, for as long
  as the box took to start.

  Deliberately still. The theme's boot animation plays a few seconds later, and
  two animations in a row with nothing between them read as a stutter rather
  than as a start. So this is a ground and a wordmark: the same ground the
  window is created with (`backgroundColor`), so the handover to the interface
  is a change of content on an unchanged colour.

  No JavaScript at all. A boot screen that can hang is not a boot screen — the
  one line that appears late is a CSS animation, and it says nothing the
  journal does not say better; it exists so that a box stuck here looks stuck
  rather than finished.
-->
<style>
  html, body {
    margin: 0; height: 100%;
    background: #09090f;
    color: #e8e8f0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  .wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
  }
  .mark {
    font-size: 34px; font-weight: 600;
    letter-spacing: 0.42em; text-indent: 0.42em;
    opacity: 0.92;
  }
  .dot {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 3px; background: #B15BFF;
    transform: translateY(-4px); margin-right: 18px;
  }
  /* Appears after eight seconds and stays. Nothing depends on it: it is there
     so a box that is stuck looks stuck, on a screen with no keyboard. */
  .note {
    font-size: 14px; opacity: 0;
    color: rgba(232, 232, 240, 0.45);
    animation: show 600ms ease 8s forwards;
  }
  @keyframes show { to { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) {
    .note { animation: none; opacity: 1 }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><span class="dot"></span>GAMECORE</div>
    <div class="note">Démarrage en cours…</div>
  </div>
</body>
</html>
