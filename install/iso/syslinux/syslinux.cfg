# Legacy-BIOS boot menu.
#
# mkarchiso generates isolinux/isolinux.cfg itself and points it at this file,
# and it substitutes %INSTALL_DIR% / %ARCHISO_LABEL% below. Everything the ISO
# boots with on a BIOS machine is therefore in this one file — releng splits it
# across five includes to share them with its PXE mode, which this profile does
# not have.
#
# One INITRD per entry, and the microcode is inside it. This file used to list
# intel-ucode.img and amd-ucode.img ahead of the initramfs; mkarchiso no longer
# stages those files (archiso#226) and syslinux does not report a missing one —
# it abandons the boot and redraws this menu, so the countdown restarts for
# ever and nothing on screen says why. The `microcode` hook in
# airootfs/etc/mkinitcpio.conf.d/archiso.conf carries both vendors now.
#
# menu.c32 and not vesamenu.c32: vesamenu needs a working VESA mode before it
# can draw anything, and when it does not get one the machine shows a blank
# screen with no menu and no way to pick the safe-graphics entry — which is the
# entry someone in that situation is trying to reach.

UI menu.c32
PROMPT 0
MENU TITLE GameCore Installer
TIMEOUT 50
DEFAULT gamecore

LABEL gamecore
  MENU LABEL Install ^GameCore
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%

LABEL gamecorenomodeset
  MENU LABEL Install GameCore (^safe graphics)
  # See the matching UEFI entry: a black screen and a broken ISO are the same
  # event to the person holding the USB stick.
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset

LABEL existing
  MENU LABEL Boot the ^existing system on this machine
  # Someone who leaves the stick in after installing must not reinstall by
  # accident. localboot is the escape hatch, and the reason the timeout above
  # picks the installer rather than this: on the first boot there is usually
  # nothing to fall back to.
  COM32 chain.c32
  APPEND hd0 0
