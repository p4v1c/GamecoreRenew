#
# The pacman.conf that ships INSIDE the image — the live session's, and by way
# of the root copy, the installed box's. install/iso/pacman.conf is a different
# file with a different job (it configures the build host).
#

[options]
HoldPkg     = pacman glibc
Architecture = auto

CheckSpace
ParallelDownloads = 5
Color

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Enabled, and it has to be. The ISO ships lib32-vulkan-radeon / -intel /
# -nvidia, so the installed box already HAS them — but install/arch.sh decides
# whether to ask for the 32-bit drivers by reading `pacman-conf --repo-list` for
# multilib. Left disabled, every later re-run of the installer on that box would
# print "[multilib] is not enabled — skipping the 32-bit Vulkan drivers" and
# quietly stop maintaining drivers that are sitting there installed.
[multilib]
Include = /etc/pacman.d/mirrorlist
