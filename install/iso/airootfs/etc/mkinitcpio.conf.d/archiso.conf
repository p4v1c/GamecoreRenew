# The hooks that let the initramfs find the ISO and mount the squashfs.
#
# THIS FILE IS ONLY READ BECAUSE mkinitcpio.d/linux.preset POINTS AT IT BY NAME.
# A preset that sets `ALL_config=/etc/mkinitcpio.conf` makes mkinitcpio run with
# `-c`, and `-c` turns OFF the automatic sourcing of /etc/mkinitcpio.conf.d/ —
# every line below is then ignored and the image is built with the stock Arch
# hooks instead. Read the head of linux.preset before changing either file.
#
# `archiso` and `archiso_loop_mnt` come from mkinitcpio-archiso; drop either and
# the kernel boots to an emergency shell with the image sitting right there,
# unmounted.
#
# `microcode` is what puts the CPU microcode INSIDE this image, as the early
# uncompressed cpio the kernel reads before anything else. archiso used to stage
# intel-ucode.img and amd-ucode.img beside the kernel for the bootloaders to
# load as extra initrds; it does not any more (archiso#226), so a profile that
# still asks for those paths asks for files that are not in the image — which is
# a systemd-boot that refuses to start and a syslinux that silently returns to
# its own menu. The microcode travels in this one file now, and the boot configs
# name one initrd each.
#
# There is NO `autodetect` hook here, and `microcode` must stay ahead of one if
# anybody ever adds it. autodetect narrows the build to the hardware of the
# machine doing the building: put it first and the microcode hook contributes
# that builder's CPU vendor alone. A live medium boots on a machine it has never
# seen — measured on an AMD build host, the autodetect ordering yields an image
# carrying AuthenticAMD.bin and no GenuineIntel.bin, and the ISO then boots
# every Intel machine with no microcode update at all.
#
# releng also carries four archiso_pxe_* hooks. They are absent here on purpose:
# this profile has no PXE bootmode, and a hook that runs at every boot to look
# for a network root nobody configured is delay on the boot path of a machine
# whose whole job is to show a wizard.
#
# `keyboard` is listed and releng does not list it. The live session is a
# graphical installer with text fields — a USB keyboard that only starts working
# after udev settles is a keyboard that does not work on the disk-password page.
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
