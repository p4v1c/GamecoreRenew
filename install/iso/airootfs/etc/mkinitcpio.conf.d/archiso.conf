# The hooks that let the initramfs find the ISO and mount the squashfs.
#
# `archiso` and `archiso_loop_mnt` come from mkinitcpio-archiso; drop either and
# the kernel boots to an emergency shell with the image sitting right there,
# unmounted.
#
# releng also carries four archiso_pxe_* hooks. They are absent here on purpose:
# this profile has no PXE bootmode, and a hook that runs at every boot to look
# for a network root nobody configured is delay on the boot path of a machine
# whose whole job is to show a wizard.
#
# `keyboard` is listed and releng does not list it. The live session is a
# graphical installer with text fields — a USB keyboard that only starts working
# after udev settles is a keyboard that does not work on the disk-password page.
HOOKS=(base udev modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
