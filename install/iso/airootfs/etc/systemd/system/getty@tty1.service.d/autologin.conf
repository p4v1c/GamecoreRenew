[Service]
# The empty ExecStart is not redundant. systemd APPENDS to ExecStart for a
# Type=simple unit unless the list is cleared first, so without the blank line
# tty1 tries to run two getty processes and the second one exits immediately —
# leaving a login prompt and no installer.
ExecStart=
ExecStart=-/usr/bin/agetty --autologin root --noclear %I 38400 linux
