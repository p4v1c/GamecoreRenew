title    Install GameCore
sort-key 01
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/intel-ucode.img
initrd   /%INSTALL_DIR%/boot/amd-ucode.img
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
# archisolabel rather than archisosearchuuid: both placeholders are substituted
# by mkarchiso, but the label form has worked in every archiso release, while
# the UUID form is newer. The one thing the profile must not do is depend on the
# archiso version of whoever builds it — the build happens on someone else's
# machine, and a boot failure there looks like a broken ISO, not a stale tool.
options  archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%
