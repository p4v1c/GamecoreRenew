title    Install GameCore (safe graphics)
sort-key 02
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/intel-ucode.img
initrd   /%INSTALL_DIR%/boot/amd-ucode.img
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
# The whole ISO is a graphical installer, so "the screen stayed black" is the
# same thing as "the ISO does not work" to the person holding the USB stick.
# nomodeset gets a picture out of almost anything — old NVIDIA cards in
# particular — at the cost of an unaccelerated desktop, which a wizard with four
# pages does not care about. The installed system is unaffected: this flag is on
# the live kernel command line only.
options  archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset
