#
# pacman.conf used to BUILD the ISO's root filesystem.
#
# This is not the pacman.conf the installed box ends up with — mkarchiso reads
# this one on the build host to populate airootfs, and airootfs/etc/pacman.conf
# is what ships. They are separate on purpose: the build needs [multilib]
# whether or not the build host has it enabled.
#

[options]
HoldPkg      = pacman glibc
Architecture = auto

CheckSpace
ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Enabled here and NOT left to the build host's configuration. packages.x86_64
# asks for lib32-vulkan-radeon and friends; on a host without [multilib] those
# are "target not found" and mkarchiso stops with a wall of errors that reads
# like a broken profile rather than a missing repo. The 32-bit Vulkan drivers
# are what let Proton titles render, so they are not optional for a games box.
[multilib]
Include = /etc/pacman.d/mirrorlist
