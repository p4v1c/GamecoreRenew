# GameCore Rest mode: installed by install/steps/setup-rest-mode.sh as
# /etc/systemd/logind.conf.d/90-gamecore.conf.
[Login]
# A short press of the case button sleeps instead of powering off. Only when
# nobody else takes the key: Plasma's PowerDevil does in a desktop session and
# keeps its own setting there. A long press is the firmware's force-off.
HandlePowerKey=suspend
# How long a sleep waits for GameCore to close every game
# (backend/services/sleep_guard.py budgets 12 s). logind's default is 5 s.
InhibitDelayMaxSec=15
