# GameCore seed for Snes9x GTK.
# Dynamic joystick bindings are deliberately Unset; generator.py owns them.

[Display]
FullscreenOnOpen = true
ScaleToFit = true
MaintainAspectRatio = true
AspectRatio = 2
HardwareAcceleration = opengl
BilinearFilter = false

[OpenGL]
VSync = true
ReduceInputLag = true

[Sound]
MuteSound = false
PlaybackRate = 7
AutomaticInputRate = true

[Behavior]
PauseEmulationWhenFocusLost = false
PreventScreensaver = true
DefaultESCKeyBehavior = 1

[Input]
ControllerPort0 = joypad
ControllerPort1 = joypad
JoystickThreshold = 40

[Joypad 0]
b_up = Joystick 1 Axis 6 + 40%
b_down = Joystick 1 Axis 6 - 40%
b_left = Joystick 1 Axis 7 - 40%
b_right = Joystick 1 Axis 7 + 40%
b_start = Joystick 1 Button 6
b_select = Joystick 1 Button 4
b_a = Unset
b_b = Unset
b_x = Unset
b_y = Unset
b_l = Joystick 1 Button 9
b_r = Joystick 1 Button 10
b_a_turbo = Unset
b_b_turbo = Unset
b_x_turbo = Unset
b_y_turbo = Unset
b_l_turbo = Unset
b_r_turbo = Unset
b_a_sticky = Unset
b_b_sticky = Unset
b_x_sticky = Unset
b_y_sticky = Unset
b_l_sticky = Unset
b_r_sticky = Unset

[Joypad 1]
b_up = Joystick 2 Axis 6 + 40%
b_down = Joystick 2 Axis 6 - 40%
b_left = Joystick 2 Axis 7 - 40%
b_right = Joystick 2 Axis 7 + 40%
b_start = Joystick 2 Button 6
b_select = Joystick 2 Button 4
b_a = Unset
b_b = Unset
b_x = Unset
b_y = Unset
b_l = Joystick 2 Button 9
b_r = Joystick 2 Button 10
b_a_turbo = Unset
b_b_turbo = Unset
b_x_turbo = Unset
b_y_turbo = Unset
b_l_turbo = Unset
b_r_turbo = Unset
b_a_sticky = Unset
b_b_sticky = Unset
b_x_sticky = Unset
