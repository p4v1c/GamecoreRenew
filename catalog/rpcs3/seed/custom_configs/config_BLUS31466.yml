# ============================================================================
# RPCS3 per-game config — Call of Duty: Advanced Warfare (BLUS31466 US, v01.20)
# Target: GMKtec NucBox M7 Ultra (Ryzen 7 PRO 6850U + Radeon 680M) — Manjaro
# ----------------------------------------------------------------------------
# Goal: KILL THE TEXTURE SHIMMER / FLICKER.
# Path RPCS3 (native) actually reads: ~/.config/rpcs3/custom_configs/
#   (NOT ~/.config/rpcs3/config/custom_configs/ — that folder is ignored.)
# Only lists values that differ from the global defaults.
# ============================================================================
Core:
  # AMD CPU without TSX: stabilises RSX reservations (already true globally,
  # pinned here so the per-game config does not depend on the global one).
  Accurate RSX reservation access: true
Video:
  Renderer: Vulkan
  Resolution Scale: 100
  # >>> THE FIX <<< Activision/Call of Duty titles shimmer (surfaces flicker)
  # on RPCS3 for as long as Write Color Buffers is off. Turning it on fixes it.
  # (Documented RPCS3 workaround.)
  Write Color Buffers: true
  # +1-2 FPS, free on 16 threads, smooths out the hitches.
  Multithreaded RSX: true
  # FSR on output: compensates the blur from the internal ~600p -> screen upscale.
  Output Scaling Mode: FidelityFX Super Resolution
  # Moderate sharpening (30): enough for readability without re-amplifying edge
  # shimmer — high sharpening accentuates the temporal shimmer we came to remove.
  FidelityFX CAS Sharpening Intensity: 30
Miscellaneous:
  # Enables Feral GameMode during emulation (sudo pacman -S gamemode).
  Enable GameMode: true
