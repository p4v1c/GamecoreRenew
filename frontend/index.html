<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameCore</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      html { background: #09090f; }
      html.overlay-mode, body.overlay-mode, body.overlay-mode #root { background: transparent !important; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // Paints before the bundle runs: the shell's boot colour (theme boot.background,
      // from the preload), or Shelf flashed dark between its paper window and splash.
      // CSSOM drops an invalid value, so the default above stays.
      try { document.documentElement.style.backgroundColor = window.gamecore.bootBackground || '' } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
